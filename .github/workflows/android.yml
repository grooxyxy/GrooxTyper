name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Install NDK, CMake, platform
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973" "cmake;3.22.1" || true
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Cache pip (ultralytics)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-ultralytics-v1

      - name: Download & export bubble model (MangaLens YOLO11n-seg -> ONNX, <50MB)
        run: |
          pip install --quiet ultralytics
          curl -sL --retry 3 -o /tmp/mangalens.pt "https://huggingface.co/huyvux3005/manga109-segmentation-bubble/resolve/main/best.pt"
          ls -la /tmp/mangalens.pt
          python3 -c "
          from ultralytics import YOLO
          m = YOLO('/tmp/mangalens.pt')
          print('exported:', m.export(format='onnx', imgsz=640, dynamic=False, opset=17))
          "
          mv /tmp/mangalens.onnx app/src/main/assets/models/bd.onnx
          SIZE=$(stat -c%s app/src/main/assets/models/bd.onnx)
          echo "bubble model size: $SIZE bytes"
          test "$SIZE" -lt 52428800

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Gradle version
        run: ./gradlew --version

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
