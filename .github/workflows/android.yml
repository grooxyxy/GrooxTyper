name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Cari sdkmanager (gagal keras bila tak ada)
        run: |
          for d in "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" /usr/local/lib/android/sdk/cmdline-tools/latest/bin "/usr/local/lib/android/sdk/cmdline-tools/16.0/bin"; do
            if [ -x "$d/sdkmanager" ]; then echo "SDKMANAGER=$d/sdkmanager" >> $GITHUB_ENV; echo "ketemu: $d/sdkmanager"; exit 0; fi
          done
          echo "sdkmanager tidak ketemu"; ls "$ANDROID_SDK_ROOT/cmdline-tools" || true; exit 1

      - name: Accept licenses
        run: yes | "$SDKMANAGER" --licenses || true

      - name: Install NDK, CMake, platform
        run: |
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973" "cmake;3.22.1" || true
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Cache pip (ultralytics)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-ultralytics-v1

      - name: Model bubble kzkt (dari APK, XOR 0x5A -> ONNX, kuantisasi int8)
        run: |
          set -uo pipefail
          mkdir -p app/src/main/assets/models
          # Model bubble diambil dari APK rilis KZKT: repo kouzen-neo/kzkt hanya
          # berisi docs, modelnya ada di dalam assets/models/kzkt.dat dan
          # sengaja disamarkan (XOR satu byte 0x5A). Hanya entri itu yang
          # diunduh lewat HTTP Range (86MB dari 125MB), lalu di-inflate +
          # didekode, lalu dikuantisasi int8 (98.8MB -> sekitar 26MB).
          URL="https://github.com/kouzen-neo/kzkt/releases/download/v2.1.1/KZKT-arm64-v8a-v2.1.1.apk"
          curl -sL --retry 3 -H "Range: bytes=43639867-129836409" -o /tmp/kzkt.deflate "$URL"
          ls -la /tmp/kzkt.deflate
          python3 - <<'PY'
          import zlib
          raw = zlib.decompressobj(-15).decompress(open('/tmp/kzkt.deflate', 'rb').read())
          if len(raw) != 103627861:
              raise SystemExit('ukuran kzkt.dat tak sesuai: %d' % len(raw))
          tbl = bytes(x ^ 0x5A for x in range(256))
          open('/tmp/bd_f32.onnx', 'wb').write(raw.translate(tbl))
          print('onnx float32 siap:', len(raw), 'byte')
          PY
          SIZE=$(stat -c%s /tmp/bd_f32.onnx)
          echo "bubble model float32 size: $SIZE bytes"
          pip install --quiet onnx onnxruntime > /dev/null 2>&1 || echo "pip onnx gagal (pakai float32)"
          python3 - <<'PY' || echo "kuantisasi gagal (pakai float32)"
          import onnx
          from onnxruntime.quantization import quantize_dynamic, QuantType
          model = onnx.load('/tmp/bd_f32.onnx')
          quantize_dynamic(model, '/tmp/bd_int8.onnx', weight_type=QuantType.QInt8)
          print('onnx int8 siap')
          PY
          if [ -f /tmp/bd_int8.onnx ]; then
            cp /tmp/bd_int8.onnx app/src/main/assets/models/bd.onnx
          else
            cp /tmp/bd_f32.onnx app/src/main/assets/models/bd.onnx
          fi
          ls -la app/src/main/assets/models/bd.onnx
          SIZE=$(stat -c%s app/src/main/assets/models/bd.onnx)
          echo "bubble model final size: $SIZE bytes"
          if [ "$SIZE" -ge 52428800 ]; then
            echo "::warning::model bubble $SIZE byte (>50MB): kuantisasi int8 tak menghasilkan berkas"
          fi
          test -s app/src/main/assets/models/bd.onnx

      - name: Download heal model (MiGAN pipeline v2 -> ONNX, <50MB)
        run: |
          curl -sL --retry 3 -o app/src/main/assets/models/mg.onnx "https://huggingface.co/andraniksargsyan/migan/resolve/main/migan_pipeline_v2.onnx"
          ls -la app/src/main/assets/models/mg.onnx
          SIZE=$(stat -c%s app/src/main/assets/models/mg.onnx)
          echo "migan model size: $SIZE bytes"
          test "$SIZE" -lt 52428800

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Gradle version
        run: ./gradlew --version

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
