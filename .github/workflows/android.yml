name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Model bubble KZKT dipatok ke rilis terbaru + hash hasil decode.
      # Ganti tag/hash HANYA setelah model baru lolos verifikasi manual.
      KZKT_TAG: v2.3.6
      KZKT_MODEL_SHA: c646d17e33d3577e5f2333977c4837e6b8110de45d9400fc00ad133dee4d3983
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Cari sdkmanager (gagal keras bila tak ada)
        run: |
          for d in "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" /usr/local/lib/android/sdk/cmdline-tools/latest/bin "/usr/local/lib/android/sdk/cmdline-tools/16.0/bin"; do
            if [ -x "$d/sdkmanager" ]; then echo "SDKMANAGER=$d/sdkmanager" >> $GITHUB_ENV; echo "ketemu: $d/sdkmanager"; exit 0; fi
          done
          echo "sdkmanager tidak ketemu"; ls "$ANDROID_SDK_ROOT/cmdline-tools" || true; exit 1

      - name: Accept licenses
        run: yes | "$SDKMANAGER" --licenses || true

      - name: Install NDK, CMake, platform
        run: |
          "$SDKMANAGER" --install "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1" || true
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Cache pip (onnx)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-onnx-v2

      - name: Cache model bubble KZKT
        id: model-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/models/bd.onnx
          key: kzkt-model-${{ env.KZKT_TAG }}-${{ env.KZKT_MODEL_SHA }}

      - name: Siapkan model bubble KZKT (dari APK, XOR 0x5A -> ONNX)
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/models
          # Model bubble diambil dari APK rilis KZKT: repo kouzen-neo/kzkt hanya
          # berisi docs, modelnya ada di dalam assets/models/kzkt.dat dan
          # sengaja disamarkan (XOR satu byte 0x5A). Skrip fetch membaca ZIP
          # central directory lewat HTTP Range, jadi offset tidak di-hardcode
          # dan tag baru cukup diganti lewat env KZKT_TAG.
          #
          # Kenapa tak dikuantisasi int8 dinamis lagi:
          #   quantize_dynamic menghasilkan op ConvInteger, dan AAR
          #   onnxruntime-android tidak punya kernel itu - sesi gagal dibuat
          #   sehingga aplikasi menampilkan "ORT_NOT_IMPLEMENTED ...
          #   ConvInteger". Varian yang dipakai sekarang:
          #     1) fp16  - bobot float16, ~49.5MB, semua op Float/Conv.
          #     2) int8  - kuantisasi STATIS format QOperator (QLinearConv),
          #                 bukan ConvInteger.
          # Setiap varian WAJIB lewat uji kontrak (sesi onnxruntime sungguhan
          # + IoU kotak decoder) sebelum dipakai; kalau tidak ada yang lolos,
          # build gagal, bukan diam-diam mengirim model rusak ke perangkat.
          python3 scripts/fetch-kzkt-model.py \
            --tag "$KZKT_TAG" \
            --sha256 "$KZKT_MODEL_SHA" \
            --out /tmp/bd_f32.onnx
          SIZE=$(stat -c%s /tmp/bd_f32.onnx)
          echo "bubble model float32 size: $SIZE bytes"
          python3 -m pip install --quiet --disable-pip-version-check onnx onnxruntime onnxconverter-common

          FINAL=""
          for VARIAN in fp16 int8; do
            echo "--- mencoba varian $VARIAN ---"
            rm -f /tmp/bd_try.onnx
            if python3 scripts/make-bubble-model.py "$VARIAN" /tmp/bd_f32.onnx /tmp/bd_try.onnx; then
              FS=$(stat -c%s /tmp/bd_try.onnx)
              echo "ukuran varian $VARIAN: $FS byte"
              if [ "$FS" -lt 52428800 ] && python3 scripts/verify-bubble-model.py /tmp/bd_try.onnx; then
                echo "VARIAN DIPAKAI: $VARIAN ($FS byte)"
                FINAL=/tmp/bd_try.onnx
                break
              fi
              echo "varian $VARIAN tidak dipakai (ukuran atau uji kontrak gagal)"
            else
              echo "konversi varian $VARIAN gagal"
            fi
          done
          if [ -z "$FINAL" ]; then
            echo "::error::tidak ada varian model bubble yang lolos uji kontrak"
            exit 1
          fi
          cp "$FINAL" app/src/main/assets/models/bd.onnx
          ls -la app/src/main/assets/models/bd.onnx
          SIZE=$(stat -c%s app/src/main/assets/models/bd.onnx)
          echo "bubble model final size: $SIZE bytes"
          test "$SIZE" -lt 52428800

      - name: Verifikasi asset model bubble
        run: |
          set -euo pipefail
          test -s app/src/main/assets/models/bd.onnx
          SIZE=$(stat -c%s app/src/main/assets/models/bd.onnx)
          echo "bd.onnx: $SIZE bytes"
          test "$SIZE" -lt 52428800

      - name: Download heal model (MiGAN pipeline v2 -> ONNX, <50MB)
        run: |
          curl -sL --retry 3 -o app/src/main/assets/models/mg.onnx "https://huggingface.co/andraniksargsyan/migan/resolve/main/migan_pipeline_v2.onnx"
          ls -la app/src/main/assets/models/mg.onnx
          SIZE=$(stat -c%s app/src/main/assets/models/mg.onnx)
          echo "migan model size: $SIZE bytes"
          test "$SIZE" -lt 52428800

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Gradle version
        run: ./gradlew --version

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Ringkasan APK
        if: success()
        run: |
          {
            echo "### APK GrooxTyper"
            echo ""
            echo "| Varian | Ukuran |"
            echo "|---|---|"
            for f in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
              [ -f "$f" ] || continue
              echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"
            done
            echo ""
            echo "Model bubble: KZKT \`$KZKT_TAG\` (sha256 \`$KZKT_MODEL_SHA\`)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
